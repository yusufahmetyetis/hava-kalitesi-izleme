server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker'in gomulu DNS'i. Sabit hostname'li proxy_pass nginx acilirken TEK SEFER
        # cozulup onbellege alinir; backend container'i yeniden yaratilinca IP'si degisir ve
        # frontend 502 vermeye baslar (frontend'i de restart etmeden duzelmez). Hostname'i
        # degiskene alip resolver vermek nginx'i her istekte yeniden cozmeye zorlar.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;

        # proxy_pass degisken icerdiginde eski "http://backend:8000/" yazimindaki sondaki
        # slash'in yaptigi /api/ -> / kirpmasi otomatik uygulanmaz; bu yuzden URI'yi burada
        # elle kirpiyoruz (upstream /api/readings/latest degil /readings/latest gormeli).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
